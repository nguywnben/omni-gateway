{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni-gateway.fullname" . }}
  labels:
    {{- include "omni-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.apiKey }}
  API_KEY: {{ .Values.secrets.apiKey | b64enc }}
  {{- end }}
  {{- if .Values.secrets.panelPassword }}
  PANEL_PASSWORD: {{ .Values.secrets.panelPassword | b64enc }}
  {{- end }}
  {{- if .Values.secrets.setupToken }}
  SETUP_TOKEN: {{ .Values.secrets.setupToken | b64enc }}
  {{- end }}
  {{- if .Values.secrets.metricsToken }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | b64enc }}
  {{- end }}
  {{- if .Values.secrets.langfusePublicKey }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | b64enc }}
  {{- end }}
  {{- if .Values.secrets.langfuseSecretKey }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | b64enc }}
  {{- end }}
{{- end }}
