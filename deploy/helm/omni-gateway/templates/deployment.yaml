apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omni-gateway.fullname" . }}
  labels:
    {{- include "omni-gateway.labels" . | nindent 4 }}
spec:
  # Omni Gateway 1.x holds routing/rate-limit state in process memory and
  # must run as a single replica. Recreate avoids two writers on the ledger.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "omni-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omni-gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ int (default "4283" (get .Values.env "PORT")) }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- $secretName := include "omni-gateway.secretName" . }}
            {{- range $envName := list "API_KEY" "PANEL_PASSWORD" "SETUP_TOKEN" "METRICS_TOKEN" "LANGFUSE_PUBLIC_KEY" "LANGFUSE_SECRET_KEY" }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $envName }}
                  optional: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/backend/data/creds
              subPath: creds
            - name: data
              mountPath: /app/backend/data/logs
              subPath: logs
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omni-gateway.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
