{{- if .Values.serviceMonitor.enabled }}
{{- if and (not .Values.secrets.existingSecret) (lt (len .Values.secrets.metricsToken) 32) }}
{{- fail "serviceMonitor.enabled requires secrets.metricsToken with at least 32 bytes or secrets.existingSecret" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "omni-gateway.fullname" . }}
  labels:
    {{- include "omni-gateway.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "omni-gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "omni-gateway.secretName" . }}
          key: METRICS_TOKEN
{{- end }}
