# Default values for omni-gateway.
#
# IMPORTANT: this release supports exactly ONE replica and ONE worker. W4.19
# recorded no coordinated activation. The chart rejects other replica counts.

image:
  repository: nguywnben/omni-gateway
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 4283

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistent storage for credentials, the usage/cost ledger, and logs.
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 2Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Non-secret configuration. Every key maps directly to an environment
# variable documented in .env.example.
env:
  HOST: 0.0.0.0
  PORT: "4283"
  WORKERS: "1"
  OMNI_RUNTIME_MODE: standalone
  OMNI_REPLICA_COUNT: "1"
  OMNI_COORDINATION_NAMESPACE: ""
  OMNI_DEPLOYMENT_ID: ""
  OMNI_COORDINATION_EPOCH: ""
  LOG_LEVEL: info
  ROUTING_STRATEGY: balanced
  PREFERRED_PROVIDER: ""
  RESPONSE_CACHE_ENABLED: "false"
  RESPONSE_CACHE_TTL_SECONDS: "300"
  RESPONSE_CACHE_MAX_ENTRIES: "1000"
  GUARDRAILS_ENABLED: "false"
  GUARDRAILS_PII_MASKING_ENABLED: "true"
  GUARDRAILS_INJECTION_DETECTION_ENABLED: "true"
  GUARDRAILS_BLOCKED_KEYWORDS: ""
  LANGFUSE_HOST: https://cloud.langfuse.com
  PROMETHEUS_EXPORT_ENABLED: "false"
  OTEL_EXPORT_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_PROTOCOL: http/json
  OTEL_EXPORT_INTERVAL_SECONDS: "60"
  TRUST_PROXY_HEADERS: "false"

# Secret values. When existingSecret is set, it is used as-is and the
# inline values below are ignored. Keys: API_KEY, PANEL_PASSWORD,
# SETUP_TOKEN, METRICS_TOKEN, OTEL_EXPORTER_OTLP_HEADERS,
# LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, REDIS_URL,
# OMNI_COORDINATION_KEY.
secrets:
  existingSecret: ""
  apiKey: ""
  panelPassword: ""
  setupToken: ""
  metricsToken: ""
  otelExporterHeaders: ""
  langfusePublicKey: ""
  langfuseSecretKey: ""
  redisUrl: ""
  coordinationKey: ""

# Prometheus Operator integration.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# PrometheusRule integration using the symptom-based rules maintained by this chart.
alerting:
  enabled: false
  labels: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
